spring.application.name=MyWeb_BE

server.servlet.context-path=/myweb
server.port=8006

# 요청 Entry Point 는 http://localhost:8006/myweb

# 기존 Oracle 을 MySQL 로 마이그레이션하기
# 1. pom.xml 에 MySQL Driver 라이브러리 추가
# 2. application.properties 에 접속 정보 셋팅

# DB 접속정보 셋팅 - 오라클 연동 구문
# spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
# spring.datasource.username=FULLSTACK
# spring.datasource.password=FULLSTACK

# DB 접속정보 셋팅 - MySQL 연동 구문
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/practice
# 내 로컬 컴퓨터의 3306 (mysql 의 기본 포트번호) 의 practice 라는 스키마에 접속하겠다.
spring.datasource.username=root
spring.datasource.password=mysql

# MyBatis 연동 셋팅
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mappers/*.xml

# 파일업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB