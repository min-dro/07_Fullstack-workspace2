spring.application.name=JPA_Practice

server.servlet.context-path=/jpa
server.port=8006

# MySQL 연동 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/jpa
spring.datasource.username=root
spring.datasource.password=mysql

# JPA 연동 설정
spring.jpa.hibernate.ddl-auto=update
# create : Entity 생성 전 기존 테이블이 있다면 DROP 후 CREATE 를 매번 새로이 하겠다. (최초에만 씀)
# update : Entity 를 기준으로 테이블을 자동 생성/수정 (작업중에 씀, columnDefinition 안먹힘)
spring.jpa.show-sql=true
# 내부적으로 JPA 가 만들어서 실행하는 SQL 문을 콘솔에 찍어주겠다.
spring.jpa.properties.hibernate.format_sql=true
# SQL 문을 출력할 때 보기 좋게 정렬해서 출력하겠다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 사용할 데이터베이스 (MySQL) 에 맞는 SQL 문으로 생성하겠다.